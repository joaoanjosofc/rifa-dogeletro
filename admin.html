<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin · RIFA PRIME</title>
<!-- ============================================================
     PAINEL ADMIN — conectado ao Supabase (projeto RIFA SAAS)
     Login: Supabase Auth (email + senha). Admin: ceo@dogeletro.com.br
     Tudo protegido por RLS + verificação de admin no servidor.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e5182c;--red-dark:#b90f20;--green:#16a34a;--green-dark:#118a3e;
  --gold:#f6b70e;--ink:#16161c;--ink2:#22222b;--panel:#1c1c24;--panel2:#242430;
  --line:#2e2e3a;--txt:#e9e9ef;--txt2:#a6a6b4;--txt3:#6f6f7e;--accent:#4f7cff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:#0c0c10;color:var(--txt);min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}
::selection{background:var(--red);color:#fff}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#1a1420 0%,#0c0c10 60%);z-index:100;padding:20px}
.login-card{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{display:flex;flex-direction:column;line-height:.9;margin-bottom:6px}
.login-logo b{font-weight:900;font-style:italic;font-size:26px;color:#fff;text-shadow:2px 2px 0 var(--red-dark)}
.login-logo span{font-weight:900;font-style:italic;font-size:14px;letter-spacing:5px;color:var(--red)}
.login-card h1{font-size:16px;font-weight:700;margin:14px 0 3px}
.login-card p.sub{color:var(--txt2);font-size:12.5px;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#ef2338,var(--red-dark));color:#fff;font-weight:700;padding:11px 16px;border-radius:10px;transition:.15s;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--red);background:var(--ink)}
.btn.green{background:linear-gradient(180deg,#1fbf5e,var(--green-dark))}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.gold{background:linear-gradient(180deg,#ffcf3d,#e0a40b);color:#3a2a00}
.login-tab{display:flex;gap:6px;margin-bottom:16px;background:var(--ink);padding:4px;border-radius:11px}
.login-tab button{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;color:var(--txt2)}
.login-tab button.on{background:var(--red);color:#fff}
.aviso{font-size:12px;padding:9px 12px;border-radius:9px;margin-top:12px}
.aviso.erro{background:#3a1218;color:#ff9aa6;border:1px solid #5a1a24}
.aviso.ok{background:#0f2e1c;color:#7ff0ab;border:1px solid #1a5a38}

/* ---------- APP ---------- */
#app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.side .brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.side .brand b{font-weight:900;font-style:italic;font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--red-dark)}
.side .brand span{font-weight:900;font-style:italic;font-size:11px;letter-spacing:4px;color:var(--red);display:block}
.side nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.side nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:var(--txt2);font-weight:600;font-size:13.5px;text-align:left;transition:.12s}
.side nav button:hover{background:var(--ink);color:var(--txt)}
.side nav button.on{background:var(--red);color:#fff}
.side nav button .ic{font-size:16px;width:20px;text-align:center}
.side .rodape{padding:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3)}
.side .rodape .em{color:var(--txt);font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;margin-left:230px;min-width:0}
.topbar{position:sticky;top:0;z-index:15;background:rgba(12,12,16,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.topbar h2{font-size:18px;font-weight:800}
.topbar .acoes{display:flex;gap:8px;align-items:center}
.demo-badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:#3b2b00;color:var(--gold);border:1px solid #5a4400}
.demo-badge.real{background:#0f2e1c;color:#7ff0ab;border-color:#1a5a38}
.content{padding:22px 26px 60px}

/* mobile */
.hamb-adm{display:none}
@media(max-width:820px){
  .side{transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .side.open{transform:none}
  .main{margin-left:0}
  .hamb-adm{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--ink);border:1px solid var(--line)}
  .veil-adm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
}

/* ---------- cards / grid ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.kpi .lb{font-size:11.5px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:25px;font-weight:800;margin-top:7px;line-height:1}
.kpi .sm{font-size:11.5px;color:var(--txt3);margin-top:5px}
.kpi.destaque{background:linear-gradient(160deg,#2a1015,#1c1c24);border-color:#4a1a24}
.kpi.destaque .vl{color:#ff6b7c}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3 .t{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* tabela */
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabela td{padding:10px;border-bottom:1px solid var(--line);color:var(--txt)}
.tabela tr:hover td{background:var(--ink)}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.pill.pago{background:#0f2e1c;color:#7ff0ab}
.pill.pendente{background:#3b2b00;color:var(--gold)}
.pill.expirado,.pill.cancelado{background:#2a2a34;color:var(--txt3)}
.pill.ativa{background:#0f2e1c;color:#7ff0ab}
.pill.rascunho{background:#2a2a34;color:var(--txt2)}
.pill.pausada{background:#3b2b00;color:var(--gold)}
.pill.encerrada{background:#3a1218;color:#ff9aa6}
.vazio{text-align:center;color:var(--txt3);padding:30px;font-size:13px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.chart .bar{width:70%;max-width:22px;background:linear-gradient(180deg,#ff4658,var(--red-dark));border-radius:4px 4px 0 0;min-height:2px;transition:.4s;position:relative}
.chart .bar:hover{filter:brightness(1.2)}
.chart .dia{font-size:9px;color:var(--txt3);white-space:nowrap}

/* forms in cards */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.formgrid .col-full{grid-column:1/-1}
@media(max-width:640px){.formgrid{grid-template-columns:1fr}}
.range-wrap{display:flex;align-items:center;gap:12px}
.range-wrap input[type=range]{flex:1;accent-color:var(--red)}
.range-val{font-weight:800;font-size:16px;min-width:60px;text-align:right}
.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.mini-tag{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:6px}
.mini-tag b{color:#fff}
.mini-tag .x{color:var(--txt3);cursor:pointer;font-weight:800}
.mini-tag .x:hover{color:var(--red)}

.linha-premio-adm{display:grid;grid-template-columns:1fr 1fr 90px 34px;gap:8px;margin-bottom:8px;align-items:center}
.help{font-size:11.5px;color:var(--txt3);margin-top:5px;line-height:1.5}
.toggle{position:relative;width:44px;height:24px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.toggle .sl::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.sl{background:var(--green)}
.toggle input:checked+.sl::before{transform:translateX(20px)}
.row-flex{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.row-flex:last-child{border-bottom:none}
.seg{display:flex;background:var(--ink);border-radius:9px;padding:3px;gap:3px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--txt2)}
.seg button.on{background:var(--red);color:#fff}

/* IA */
.ia-box{background:linear-gradient(160deg,#161a2e,var(--panel));border:1px solid #2a3350}
.ia-saida{background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:12px;white-space:pre-wrap;font-size:13px;line-height:1.6;min-height:40px}
.insight{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:none}
.insight .em{font-size:18px;flex:none}
.insight b{color:#fff}

/* toast */
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink2);border:1px solid var(--line);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:11px;z-index:300;opacity:0;transform:translateY(16px);transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:86vw}
.toast.ver{opacity:1;transform:none}
.toast.erro{border-color:#5a1a24;background:#2a1015}
.toast.ok{border-color:#1a5a38;background:#0f2416}

/* modal */
.mveu{position:fixed;inset:0;background:rgba(6,6,10,.7);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mveu.ab{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
code.inl{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;color:#ffd27a;word-break:break-all}
.copybox{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:11.5px;color:#9fe0b0;word-break:break-all;display:flex;gap:8px;align-items:center;justify-content:space-between}
.secret-list{font-size:12.5px;line-height:1.9}
.secret-list li{margin-left:16px}
.secret-list code{color:#ffd27a}

/* uploads / tema */
.thumb-grid{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.thumb{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer}
.thumb .rm:hover{background:var(--red)}
.thumb .ordem{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:1px 5px;border-radius:5px}
.dropzone{border:1.6px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--txt2);font-size:13px;cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--red);color:var(--txt);background:var(--ink)}
.dropzone.carregando{opacity:.6;pointer-events:none}
.logo-prev{width:150px;height:76px;border-radius:11px;border:1px solid var(--line);background:#0a0a0e;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}
.logo-prev img{max-width:100%;max-height:100%}
.cor-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.cor-item{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--txt2)}
.cor-item input[type=color]{width:58px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--ink);cursor:pointer;padding:2px}
.cor-preview{flex:1;min-width:150px;border-radius:11px;padding:16px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}

/* polish */
.btn{position:relative}
.btn:active{transform:translateY(1px)}
.kpi{transition:transform .16s,border-color .16s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px);border-color:#3a3a48}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);opacity:0;transition:.16s}
.kpi:hover::after{opacity:.95}
.card{transition:border-color .16s}
.card:hover{border-color:#33333f}
.side nav button{transition:background .12s,color .12s,padding-left .12s}
.side nav button:hover{padding-left:16px}
#login{animation:fadein .4s ease}
@keyframes fadein{from{opacity:0}}
.content{animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}}

.icn{display:inline-flex;align-items:center;justify-content:center;line-height:0;vertical-align:-0.16em}
.icn>svg{width:1.08em;height:1.08em;display:block}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><b>RIFA</b><span>PRIME · ADMIN</span></div>
    <div class="login-tab">
      <button id="tab-entrar" class="on" onclick="trocaTab('entrar')">Entrar</button>
      <button id="tab-criar" onclick="trocaTab('criar')">Criar conta</button>
    </div>
    <h1 id="login-h1">Bem-vindo de volta</h1>
    <p class="sub" id="login-sub">Acesse o painel de controle da sua rifa.</p>
    <div class="field"><label>Email</label><input id="lg-email" type="email" autocomplete="username" placeholder="ceo@dogeletro.com.br"></div>
    <div class="field"><label>Senha</label><input id="lg-senha" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn full" id="lg-btn" onclick="autenticar()">Entrar</button>
    <div id="lg-aviso"></div>
    <p class="help" style="margin-top:14px">Admin autorizado: <b style="color:#fff">ceo@dogeletro.com.br</b>. Crie a conta com esse email na primeira vez — o acesso é liberado na hora.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="brand"><b>RIFA</b><span>PRIME · ADMIN</span></div>
    <nav id="nav">
      <button class="on" data-view="dashboard"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span></span> Dashboard</button>
      <button data-view="campanhas"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span></span> Campanhas</button>
      <button data-view="premios"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9"/><line x1="12" y1="8" x2="12" y2="21"/><path d="M12 8S11 3 8.5 3a2.5 2.5 0 0 0 0 5"/><path d="M12 8s1-5 3.5-5a2.5 2.5 0 0 1 0 5"/></svg></span></span> Prêmios & Chance</button>
      <button data-view="pedidos"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span></span> Pedidos</button>
      <button data-view="leads"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span></span> Leads</button>
      <button data-view="ia"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18 14l.7 1.8L20.5 16.5l-1.8.7L18 19l-.7-1.8L15.5 16.5l1.8-.7z"/></svg></span></span> IA & Análise</button>
      <button data-view="config"><span class="ic"><span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 2.6 14H2.5a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 4 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 2.6V2.5a2 2 0 0 1 4 0v.1A1.6 1.6 0 0 0 17 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1A1.6 1.6 0 0 0 21.4 12h.1a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1 1z"/></svg></span></span> Configurações</button>
    </nav>
    <div class="rodape">
      <div class="em" id="side-email">—</div>
      <button class="btn ghost sm full" style="margin-top:10px" onclick="sair()">Sair</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamb-adm" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <h2 id="titulo-view">Dashboard</h2>
      </div>
      <div class="acoes">
        <span class="demo-badge" id="demo-badge">carregando…</span>

/* ================= RPC ================= */
async function rpc(fn,args,_retry){
  const r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+(S.token||SUPA_KEY),'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(r.status===401 && !_retry && S.refresh){ if(await refrescar()) return rpc(fn,args,true); }
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&(j.message||j.hint||j.error))||('Erro '+r.status));
  return j;
}

function premioLinha(tipo,valor,desc,qtd){

function premioLinhaBil(numero,valor,desc){

async function salvarChance(id){
  const modo=S.campanhaEdit.campanha.roleta_modo;

  else{ p.roleta_alvo_giros=parseInt($('pr-alvo').value)||20; p.roleta_cooldown=parseInt($('pr-cool').value)||0; }

async function salvarRoleta(id){
  const linhas=[...document.querySelectorAll('#rol-lista .linha-premio-adm')];

  try{ const r=await rpc('rifa_admin_set_roleta_premios',{p_campanha:id,p_premios:premios}); toast('Prêmios salvos: '+r.total+' no total ','ok'); carregarPremios(id); }catch(e){ toast(e.message,'erro'); }

async function salvarBilhetes(id){
  const linhas=[...document.querySelectorAll('#bil-lista .linha-premio-adm')];
  const lista=linhas.map(l=>{const i=l.querySelectorAll('input');return{numero:parseInt(i[0].value),valor:parseFloat(i[1].value)||0,descricao:i[2].value.trim()||'NO PIX'};}).filter(b=>Number.isInteger(b.numero)&&b.valor>0);

}

  leadsCache=ls;

    '<td>'+esc(l.telefone)+'</td>'+
    '<td>'+l.pedidos+' <span style="color:var(--txt3)">('+l.pedidos_pagos+' pagos)</span></td>'+

    '<td><a class="btn ghost sm" href="https://wa.me/'+wa+'" target="_blank">WhatsApp</a></td>'+

}
function exportarLeads(){
  if(!leadsCache.length){toast('Nada para exportar','erro');return;}
  const head='Nome,Telefone,Pedidos,Pedidos pagos,Total gasto,Primeiro,Ultimo,Cliente\n';
  const linhas=leadsCache.map(l=>[l.nome,l.telefone,l.pedidos,l.pedidos_pagos,l.total_gasto,l.primeiro,l.ultimo,l.cliente?'sim':'nao'].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([head+linhas],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads-rifa.csv';a.click();
  toast('CSV exportado ','ok');
}

function gerarTextos(){
  const premio=$('ia-premio').value.trim()||'seu prêmio';
  const valor=parseFloat($('ia-valor').value)||0.45;
  const tom=$('ia-tom').value;
  const P=premio.toUpperCase();
  const titInicio={Empolgante:'🔥 CONCORRA À ',Direto:'',Premium:'✨ ',Comunidade:'🍀 '}[tom];
  const titulo=(titInicio+P).trim();
  const subs={Empolgante:'PARTICIPE POR APENAS '+brl(valor).replace('R$','R$ ')+' E GARANTA SUA SORTE!',
    Direto:'TÍTULOS A '+brl(valor)+' · SORTEIO PELA LOTERIA FEDERAL',
    Premium:'UMA OPORTUNIDADE EXCLUSIVA POR '+brl(valor),
    Comunidade:'BORA JUNTOS? CADA TÍTULO SÓ '+brl(valor)+' 🚀'}[tom];
  const reg='🎁 PRÊMIO: '+premio+' (na nota, documentado) ou o valor equivalente via PIX.\n\n'+
    '🎯 COMO PARTICIPAR: escolha a quantidade de títulos, gere o PIX e pronto — seus números aparecem em "Meus Números" na hora que o pagamento é confirmado.\n\n'+
    '🍀 PRÊMIOS INSTANTÂNEOS: além do prêmio principal, tem roleta e bilhetes premiados que pagam na hora, direto no seu PIX.\n\n'+
    '🏆 SORTEIO: realizado com base na extração da Loteria Federal, resultado público e auditável. O ganhador é anunciado nas redes e contatado pelo telefone do cadastro.\n\n'+
    '📜 Quanto mais títulos, mais chances de ganhar. Boa sorte!';
  $('ia-saida').classList.remove('hidden');
  $('ia-saida').innerHTML='<b style="color:#fff">TÍTULO</b>\n'+esc(titulo)+'\n\n<b style="color:#fff">SUBTÍTULO</b>\n'+esc(subs)+'\n\n<b style="color:#fff">REGULAMENTO</b>\n'+esc(reg)+
    '\n\n<div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost sm" onclick="copiar(`'+esc(titulo).replace(/`/g,'')+'`)">Copiar título</button><button class="btn ghost sm" onclick="copiarTexto(this)">Copiar tudo</button></div>';
  $('ia-saida').dataset.tudo='TÍTULO: '+titulo+'\nSUBTÍTULO: '+subs+'\n\n'+reg;
}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado ','ok'));}
function copiarTexto(btn){copiar($('ia-saida').dataset.tudo||'');}
function sugerirPreco(){
  const meta=parseFloat($('sg-meta').value)||0, preco=parseFloat($('sg-preco').value)||0.45;
  if(meta<=0){toast('Informe a meta','erro');return;}
  const cotasNec=Math.ceil(meta/preco);
  // arredonda para número "redondo" de marketing
  const alvos=[10000,25000,50000,75000,100000,150000,200000,300000,500000,1000000];
  const total=alvos.find(a=>a>=cotasNec)||Math.ceil(cotasNec/10000)*10000;
  const arrecadaSePreencher=total*preco;
  const pacotes=[Math.max(5,Math.round(total*0.0002/5)*5||25),50,100,150,300];
  $('sg-saida').classList.remove('hidden');
  $('sg-saida').innerHTML='Para arrecadar <b style="color:#fff">'+brl(meta)+'</b> a '+brl(preco)+' por cota:\n\n'+
    '• Cotas necessárias: <b style="color:#fff">'+num(cotasNec)+'</b>\n'+
    '• Total sugerido (redondo): <b style="color:#7ff0ab">'+num(total)+' cotas</b>\n'+
    '• Se vender tudo: <b style="color:#7ff0ab">'+brl(arrecadaSePreencher)+'</b>\n'+
    '• Pacotes sugeridos: <b style="color:#fff">'+pacotes.join(', ')+'</b>\n\n'+
    '<span style="color:var(--txt3)">Dica: preço baixo (centavos) aumenta volume e sensação de "quase de graça"; pacotes maiores elevam o ticket médio.</span>';
}
async function analisarVendas(){
  let d; try{ d=await rpc('rifa_admin_dashboard'); }catch(e){ $('an-saida').innerHTML='<div class="vazio">'+esc(e.message)+'</div>'; return; }
  const k=d.kpis;
  const ins=[];
  const ult7=d.serie.slice(-7).reduce((a,x)=>a+Number(x.arrecadado),0);
  const ant7=d.serie.slice(0,7).reduce((a,x)=>a+Number(x.arrecadado),0);
  const mediaDia=ult7/7;
  if(ant7>0){const var7=Math.round((ult7-ant7)/ant7*100);ins.push(['<span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/></svg></span>',(var7>=0?'Vendas em alta: ':'Vendas em queda: ')+(var7>=0?'+':'')+var7+'%','comparando os últimos 7 dias com os 7 anteriores.']);}
  ins.push(['<span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 4 14 11 14 10 22 20 9 13 9"/></svg></span>','Ritmo atual: '+brl(mediaDia)+'/dia','média de arrecadação dos últimos 7 dias.']);
  if(k.pedidos_pendentes>0)ins.push(['⏳',k.pedidos_pendentes+' pedidos pendentes',brl(0)!=null?'PIX gerado mas não pago — vale reforçar o lembrete.':'']);
  const leadsFrios=k.leads-k.pedidos_pagos;
  if(leadsFrios>0)ins.push(['<span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>',leadsFrios+' leads para reativar','pessoas que deram o contato mas ainda não compraram (ou não voltaram). Exporte na aba Leads e chame no WhatsApp.']);
  if(k.premios_pagar>0)ins.push(['<span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M18 5h2.5a2 2 0 0 1-2.2 4"/><path d="M6 5H3.5a2 2 0 0 0 2.2 4"/><line x1="12" y1="15" x2="12" y2="18"/><path d="M8.5 21h7l-.7-3h-5.6z"/></svg></span>',k.premios_pagar+' prêmios a pagar','há ganhadores instantâneos aguardando o PIX. Veja em Configurações › Prêmios pendentes.']);
  ins.push(['<span class="icn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></span>','Ticket médio '+brl(k.ticket_medio),'incentive pacotes maiores no site para elevar esse número.']);
  $('an-saida').innerHTML=ins.map(i=>'<div class="insight"><span class="em">'+i[0]+'</span><div><b>'+esc(i[1])+'</b><br><span style="color:var(--txt3);font-size:12px">'+esc(i[2])+'</span></div></div>').join('');
}
